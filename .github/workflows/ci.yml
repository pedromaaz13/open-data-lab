name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Lint (ruff + black + sqlfluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: pip install ruff black sqlfluff
      - name: Ruff
        run: ruff check . || true
      - name: Black (check)
        run: black --check . || true
      - name: SQLFluff
        run: sqlfluff lint . --dialect duckdb || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest pandas numpy
      - name: Run tests per project
        # Cada proyecto en 06_proyectos/ es autocontenido y se prueba aislado
        # (su propio pytest.ini como rootdir) para evitar colisiones de módulos.
        # Código de salida 5 = "no se recolectó ningún test": no es un fallo.
        run: |
          status=0
          for tdir in $(find . -type d -name tests -not -path '*/.*' | sort); do
            proj=$(dirname "$tdir")
            echo "::group::pytest $proj"
            ( cd "$proj" && pytest ) || { rc=$?; [ "$rc" = "5" ] || status=1; }
            echo "::endgroup::"
          done
          exit $status
