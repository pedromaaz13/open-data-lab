# ------------------------------------------------------------------
# Open Data Lab - stack pro open source por perfiles
#
# No todos los servicios deben levantarse a la vez. Usa perfiles:
#
#   docker compose --profile core up           # postgres + postgis
#   docker compose --profile bi up             # superset + metabase
#   docker compose --profile geo up            # postgis
#   docker compose --profile orchestration up  # dagster
#   docker compose --profile observability up  # grafana
#   docker compose --profile full up           # todo
#
# Las credenciales se leen de .env (ver .env.example).
# ------------------------------------------------------------------

services:
  postgres:
    image: postgres:16
    profiles: ["core", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-open_data_lab}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odl}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgis:
    image: postgis/postgis:16-3.4
    profiles: ["geo", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-open_data_lab}_geo
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  superset:
    image: apache/superset:latest
    profiles: ["bi", "full"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-this-secret-key}
    ports:
      - "8088:8088"
    depends_on:
      - postgres
    volumes:
      - superset_home:/app/superset_home

  metabase:
    image: metabase/metabase:latest
    profiles: ["bi", "full"]
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability", "full"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  minio:
    image: minio/minio:latest
    profiles: ["core", "full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  dagster:
    image: dagster/dagster-celery-k8s:latest
    profiles: ["orchestration", "full"]
    # Imagen de referencia: en un proyecto real se construye un Dockerfile
    # propio con el código de los pipelines. Aquí queda como placeholder.
    ports:
      - "3070:3000"
    depends_on:
      - postgres
    environment:
      DAGSTER_POSTGRES_USER: ${POSTGRES_USER:-odl}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DAGSTER_POSTGRES_DB: ${POSTGRES_DB:-open_data_lab}

volumes:
  pg_data:
  postgis_data:
  superset_home:
  metabase_data:
  grafana_data:
  minio_data:
